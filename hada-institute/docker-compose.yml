services:
  postgres:
    image: postgres:16-alpine
    container_name: hada-institute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hada_institute
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hada_institute"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
